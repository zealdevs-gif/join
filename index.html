<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
 
 .container {
	text-align: center;
	width: 24%;
	margin: auto;
	background: black;
	color: #fff;
	padding: 46px 0px;
	border-radius: 10px;
	margin-top: 70px;
}

a {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 8px;
	padding: 16px 56px;
	border-radius: 999px;
	background: #128c7e;
	color: #fff;
	font-size: 18px;
	font-weight: 600;
	margin-bottom: 28px;
	box-shadow: 0 8px 22px rgba(26, 60, 52, 0.25);
	animation: jump 1.35s ease-in-out infinite;
  text-decoration: none;
}

 @keyframes jump {
            0%, 55%, 100% { transform: translateY(0); }
            20% { transform: translateY(-16px); }
            35% { transform: translateY(0); }
            45% { transform: translateY(-8px); }
        }

 
body{
  padding: 0;
  margin: 0;
  box-sizing: border-box;
   font-family: "Inter", sans-serif;
}

.logo img {
	width: 100px;
	border-radius: 80px;
}




  </style>

</head>
<body>
  

  <div class="container">
    <div class="logo"><img src="logo.webp" alt="logo"></div>
    <h1>Join Community</h1>

    <a href="https://www.whatsapp.com/channel/0029Vb9ifmC2f3EH7Qh3fX2O">Whatsapp Now</a>
    <p>Choose Your Preferred Platform</p>
  </div>


</body>
</html>
